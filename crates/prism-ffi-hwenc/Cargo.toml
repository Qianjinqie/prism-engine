[package]
name = "prism-ffi-hwenc"
version = "0.1.0"
edition = "2021"

# 骨架：**零第三方依赖、零平台头文件**。
# VideoToolbox / NVENC 的真机 FFI 绑定留待后续版本；VA-API 已到「绑定就绪」
# （`src/vaapi_bind.rs`：`extern "C"` 函数表 + 裸 `dlopen`/`dlsym` 解析，
# **无 `#[link]`**、**不调用**任何入口、不建会话）。见 src/lib.rs 的四档分述。
#
# 主干隔离纪律：本 crate **不在** `prism-mux`（或任何主干 crate）的依赖树里。
# 需要硬件编码的下游必须显式 `prism-ffi-hwenc = { path = "...", features = [...] }`，
# 且只有 `--features videotoolbox|nvenc|vaapi` 才会引入平台相关代码。
# 因此 `cargo build -p prism-mux` 的依赖图与本 crate 完全无关（零改动风险）。
[dependencies]

[features]
default = []
# Apple VideoToolbox（macOS / iOS）：仅探测链（第一档）
videotoolbox = []
# NVIDIA NVENC（Linux / Windows，需要驱动 + CUDA headers，M3 才引入）：仅探测链
nvenc = []
# Intel/AMD VA-API（Linux）：探测链 + **绑定就绪**（第二档，unix 目标才编译绑定层）
vaapi = []

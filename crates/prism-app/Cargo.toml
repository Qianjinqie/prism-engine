[package]
name = "prism-app"
version = "0.1.0"
edition = "2021"

[lib]
# cdylib：产出 `prism_editor.wasm`（交互式编辑器页面加载）。
#
# 为什么 editor ABI 走 prism-app 而非 prism-gpu：编辑器的增量失效依赖
# prism-core 的子图签名树，而 prism-gpu 只依赖 prism-math，反向依赖 prism-core
# 会成环（prism-gpu/src/scan.rs 模块头明确禁止）。故 ABI 落在已依赖 prism-core
# 的 prism-app，对 abi.rs 零改动。
#
# rlib 保留，使 native 目标下 `cargo test -p prism-app` 与既有 CLI 完全不受影响。
# 二进制目标（main.rs）保持不变——CLI 入口不受影响。
crate-type = ["cdylib", "rlib"]

[dependencies]
prism-math = { path = "../prism-math" }
prism-gpu = { path = "../prism-gpu" }
prism-core = { path = "../prism-core" }
prism-render = { path = "../prism-render" }
prism-io = { path = "../prism-io" }
prism-dsl = { path = "../prism-dsl" }
prism-infra = { path = "../prism-infra" }
prism-aesthetic = { path = "../prism-aesthetic" }
prism-ai = { path = "../prism-ai" }
# `render` 子命令的容器出口（内置 MP4(MJPEG) muxer + ffmpeg 降级链）。
prism-mux = { path = "../prism-mux" }
# `--adaptive` 档（R-13 产品路径接线）：AdaptiveRtBackend 在 postfx
# （依赖方向 postfx → render 已存在，无法反向）。
prism-postfx = { path = "../prism-postfx" }

# V3.0 W2（D-28）：七族既有求值器接线。prism-app 是依赖图顶层（无 crate
# 依赖它），可单向下达到全部七族；particles / postfx 依赖 render，故接线
# 不能反向压进 render（会成环）。三条都是 workspace path 依赖，零第三方。
prism-particles = { path = "../prism-particles" }
prism-physics = { path = "../prism-physics" }
prism-audio = { path = "../prism-audio" }

# V3.0 W3（D-32）：六族现有 crate 接线，只接线不重实现。六族求值器分属
# author / genart / postfx / aesthetic / audio，prism-app 是依赖图顶层，
# 可单向下达；prism-noise 是几何族 hash2_f32 的确定性基元（零依赖）。
# 四条全是 workspace path，零第三方，方向单向无环。
prism-author = { path = "../prism-author" }
prism-genart = { path = "../prism-genart" }
prism-noise = { path = "../prism-noise" }

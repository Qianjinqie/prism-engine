<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Prism Engine">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161C27"/>
      <stop offset="0.55" stop-color="#0C1017"/>
      <stop offset="1" stop-color="#07090D"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#8FA8C8" stop-opacity="0.72"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#DCE8F7" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#DCE8F7" stop-opacity="0.02"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="512" height="512" rx="116" ry="116"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- 出射光谱：六条，从棱镜右面向外扇开 -->
    <g stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M318 246 L489 148" stroke="#FF4D5E"/>
      <path d="M318 246 L492 194" stroke="#FF9F1C"/>
      <path d="M318 246 L494 240" stroke="#FFD166"/>
      <path d="M318 246 L494 286" stroke="#35D07F"/>
      <path d="M318 246 L492 332" stroke="#4D9BFF"/>
      <path d="M318 246 L489 378" stroke="#A96BFF"/>
    </g>

    <!-- 棱镜本体 -->
    <path d="M256 116 L372 354 L140 354 Z" fill="url(#body)" stroke="url(#edge)" stroke-width="9" stroke-linejoin="round"/>

    <!-- 棱镜内部：折射后的混合光 -->
    <path d="M194 251 L318 246" stroke="#FFFFFF" stroke-opacity="0.62" stroke-width="7" stroke-linecap="round" fill="none"/>

    <!-- 入射白光 -->
    <path d="M40 208 L194 251" stroke="#FFFFFF" stroke-width="14" stroke-linecap="round" fill="none"/>

    <!-- 出射点光斑 -->
    <circle cx="318" cy="246" r="11" fill="#FFFFFF" fill-opacity="0.55"/>
  </g>

  <!-- 深色主题下也留出图标边界 -->
  <rect x="0.5" y="0.5" width="511" height="511" rx="115.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.12"/>
</svg>
